name: Cupones CI

# Solo comprobaciones (tipos, pruebas, build). NO despliega: el despliegue a Cloudflare es manual
# (ver cupones/docs/DESPLIEGUE.md).
on:
  pull_request:
    paths: ["cupones/**", ".github/workflows/cupones-ci.yml"]
  push:
    branches: [main]
    paths: ["cupones/**", ".github/workflows/cupones-ci.yml"]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cupones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cupones/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Comprobación de tipos
        run: npm run typecheck
      - name: Pruebas (Worker en workerd + D1 local, e interfaz)
        run: npm test
      - name: Build
        run: npm run build
